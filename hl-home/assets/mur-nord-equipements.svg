 r="35.6845" fill="#f0f3ee" stroke="#78867b"/><path d="M936.335 206.95v83.05000000000001" stroke="#c5ccc4"/><text x="818" y="344" class="n">Calypso Split</text><text x="818" y="370" class="s">L 735 × H 535 × P 330</text><text x="818" y="393" class="s">24 kg · hors support</text><path d="M38 427H1040" stroke="#d9dfd6"/><text x="38" y="457" class="n">Hauteurs nues cumulées : 550 + 734 + 734 + 535 = 2 553 mm.</text><text x="38" y="485" class="s">Inventaire dimensionnel. Ni hauteur d’installation, ni validation d’une superposition.</text></svg>