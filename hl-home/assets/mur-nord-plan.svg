<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Mur nord — proposition compacte en vue de dessus</title><desc id="desc">De gauche à droite : fenêtre libre, rangement peu profond, ensemble onduleur et batterie dans une zone sèche, réservation séparée de la PAC, puis robinet et descente d’eau accessibles. Les dégagements arrière, latéraux et frontaux de la PAC ainsi que sa zone de protection sont réservés. Schéma sans échelle, cotes et implantation à valider.</desc>
<defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#dfc8a6" stroke-width="2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#496655"/></marker><marker id="dim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#7e837b"/></marker></defs>
<rect width="1200" height="690" fill="#fcfcfa"/>
<g font-family="Arial,sans-serif" fill="#202522"><text x="45" y="40" font-size="13" letter-spacing="2" fill="#8a7258">01 / VUE DE DESSUS</text><text x="1155" y="40" text-anchor="end" font-size="12" fill="#686c68">SCHÉMA DE PRINCIPE · NON À L’ÉCHELLE</text>
<path d="M55 98H1145" stroke="#202522" stroke-width="14"/><text x="600" y="80" text-anchor="middle" font-size="17" font-weight="bold">Façade nord · longueur utile à relever</text>
<path d="M95 98H220" stroke="#b5d1d2" stroke-width="14"/><rect x="85" y="120" width="145" height="360" rx="10" fill="#f0f3f2" stroke="#ccd7d1" stroke-dasharray="5 5"/><text x="157" y="160" text-anchor="middle" font-size="16">Fenêtre</text><text x="157" y="184" text-anchor="middle" font-size="13" fill="#686c68">Ouverture libre</text><text x="157" y="434" text-anchor="middle" font-size="12" fill="#686c68">Aucun équipement</text><text x="157" y="453" text-anchor="middle" font-size="12" fill="#686c68">dans cette réserve</text>
<rect x="265" y="135" width="155" height="100" rx="5" fill="#e9e5dc" stroke="#a29175"/><text x="342" y="178" text-anchor="middle" font-size="17" font-weight="bold">Rangement</text><text x="342" y="202" text-anchor="middle" font-size="13">Peu profond</text><rect x="265" y="255" width="155" height="225" rx="5" fill="none" stroke="#b7b9af" stroke-dasharray="5 5"/><text x="342" y="340" text-anchor="middle" font-size="13" fill="#686c68">Accès aux portes</text><text x="342" y="362" text-anchor="middle" font-size="13" fill="#686c68">et au rangement</text>
<rect x="465" y="130" width="170" height="125" rx="6" fill="#e5ebe4" stroke="#6d866f"/><text x="550" y="171" text-anchor="middle" font-size="17" font-weight="bold">Solaire</text><text x="550" y="196" text-anchor="middle" font-size="14">Onduleur + batterie</text><text x="550" y="222" text-anchor="middle" font-size="12" fill="#496655">Zone sèche distincte</text><rect x="450" y="115" width="200" height="365" rx="10" fill="none" stroke="#6d866f" stroke-dasharray="5 5"/><text x="550" y="340" text-anchor="middle" font-size="13" fill="#496655">Dégagements propres</text><text x="550" y="362" text-anchor="middle" font-size="13" fill="#496655">aux deux appareils</text><text x="550" y="451" text-anchor="middle" font-size="12" fill="#496655">Maintenance / extraction</text>
<rect x="700" y="115" width="285" height="365" rx="10" fill="url(#hatch)" stroke="#b79a70" stroke-dasharray="6 5"/>
<rect x="758" y="191" width="169" height="104" rx="6" fill="#fff" stroke="#202522" stroke-width="2"/><text x="842" y="232" text-anchor="middle" font-size="21" font-weight="bold">PAC</text><text x="842" y="257" text-anchor="middle" font-size="13">Unité extérieure</text><text x="842" y="278" text-anchor="middle" font-size="11" fill="#686c68">Appuis antivibratiles</text>
<path d="M842 115V179" stroke="#7e837b" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="858" y="154" font-size="12">R arrière</text>
<path d="M707 245H746M939 245H979" stroke="#7e837b" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="842" y="325" text-anchor="middle" font-size="12" fill="#686c68">Dégagements latéraux de la notice</text>
<path d="M790 340V398M842 340V415M894 340V398" stroke="#496655" stroke-width="2" marker-end="url(#arrow)"/>
<text x="842" y="445" text-anchor="middle" font-size="13">Soufflage libre + maintenance</text><text x="842" y="466" text-anchor="middle" font-size="11">Aucune végétation devant la sortie d’air</text>
<rect x="1025" y="120" width="115" height="360" rx="10" fill="#eef3f4" stroke="#a2b7bf" stroke-dasharray="5 5"/><circle cx="1108" cy="100" r="12" fill="#b7c4c8"/><path d="M1050 110v32h22" fill="none" stroke="#68848c" stroke-width="5"/><text x="1082" y="190" text-anchor="middle" font-size="14">Eau / EP</text><text x="1082" y="215" text-anchor="middle" font-size="12">Robinet</text><text x="1082" y="236" text-anchor="middle" font-size="12">Descente</text><text x="1082" y="257" text-anchor="middle" font-size="12">Regard</text><text x="1082" y="430" text-anchor="middle" font-size="12">Accès libre</text><text x="1082" y="452" text-anchor="middle" font-size="12">Pas de batterie</text>
<path d="M55 521H1145" stroke="#84977b" stroke-width="2" stroke-dasharray="6 6"/><rect x="55" y="540" width="1090" height="45" rx="10" fill="#edf0e7"/><text x="600" y="568" text-anchor="middle" font-size="15" fill="#52684c">Bambous à reculer / couper selon l’enveloppe nécessaire · largeur disponible à mesurer</text>
<text x="55" y="621" font-size="14" font-weight="bold">La compacité s’arrête aux dégagements techniques.</text><text x="55" y="647" font-size="13" fill="#686c68">Zone hachurée : réserve PAC indicative. La zone de protection liée au fluide doit être tracée selon la notice exacte,</text><text x="55" y="668" font-size="13" fill="#686c68">sans fenêtre, source d’allumage, batterie ou évacuation incompatible. Son emprise n’est pas validée par ce dessin.</text>
</g></svg>
