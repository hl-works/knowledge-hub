<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img"><title>Vue de dessus des deux colonnes — quatre groupes superposés dans la colonne droite</title><rect width="100%" height="100%" fill="#fcfcfa"/><g font-family="Arial,sans-serif"><text x="38" y="37" font-size="20" fill="#28332f" font-weight="bold">MUR NORD / VUE DE DESSUS</text><text x="38" y="65" font-size="13" fill="#526157" font-weight="normal">Proportions constantes · emprise de simulation à confronter au relevé du passage</text><rect x="160.0" y="125.0" width="700.0" height="20.0" fill="#d8ded4" stroke="#8c9b8c" /><text x="420" y="112" font-size="13" fill="#526157" font-weight="normal">FAÇADE NORD</text><rect x="160.0" y="145.0" width="312.5" height="250.25" fill="#fbf4f0" stroke="#8c9b8c" /><rect x="472.5" y="145.0" width="25.0" height="250.25" fill="#dce2d8" stroke="#8c9b8c" /><rect x="497.5" y="145.0" width="362.5" height="250.25" fill="#f2f6ee" stroke="#8c9b8c" /><rect x="235.0" y="170.0" width="146.25" height="74.5" fill="white" stroke="#a45448" /><rect x="535.0" y="195.0" width="238.5" height="100.25" fill="white" stroke="#28332f" /><text x="240" y="208" font-size="13" fill="#526157" font-weight="normal">Batterie</text><text x="565" y="220" font-size="13" fill="#526157" font-weight="normal">4 groupes en colonne</text><text x="565" y="245" font-size="13" fill="#526157" font-weight="normal">401 mm au plus profond</text><rect x="160.0" y="395.25" width="700.0" height="250.0" fill="#f8f4e9" stroke="#b9a16c" stroke-dasharray="6 5"/><path d="M160 395.25h700" stroke="#4c705c" stroke-width="6" stroke-dasharray="15 8"/><text x="310" y="375" font-size="13" fill="#526157" font-weight="normal">Panneaux verts démontables</text><text x="300" y="488" font-size="17" fill="#28332f" font-weight="bold">Réserve d’accès : 1 000 mm*</text><text x="300" y="514" font-size="13" fill="#526157" font-weight="normal">Aucun bambou ni stockage devant les sorties d’air</text><text x="35" y="177" font-size="13" fill="#526157" font-weight="normal">200 arrière*</text><text x="35" y="257" font-size="13" fill="#526157" font-weight="normal">401 appareil</text><text x="35" y="337" font-size="13" fill="#526157" font-weight="normal">400 devant*</text><text x="885" y="263" font-size="13" fill="#526157" font-weight="normal">1 001 mm*</text><text x="885" y="286" font-size="13" fill="#526157" font-weight="normal">mur → écran</text><text x="885" y="493" font-size="13" fill="#526157" font-weight="normal">1 000 mm*</text><text x="38" y="605" font-size="13" fill="#526157" font-weight="normal">Largeur : 2 800 mm*. Profondeur : 200 + 401 + 400 = 1 001 mm*. Avec accès : 2 001 mm depuis le mur.</text><text x="38" y="632" font-size="13" fill="#526157" font-weight="normal">* Réserves d’étude : ni minima certifiés ni cotes relevées. L’habillage et la superposition exigent une validation spécifique.</text><text x="38" y="658" font-size="13" fill="#526157" font-weight="normal">Maintenir fenêtre, robinet, descente et regard accessibles. Séparer condensats et équipements électriques.</text></g></svg>