<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img"><title>Mur nord : plan coté des deux colonnes et réservations proposées</title><rect width="100%" height="100%" fill="#fcfcfa"/><style>text{font-family:Arial,sans-serif;fill:#28332f}.small{font-size:12px}.label{font-size:15px;font-weight:bold}.note{font-size:13px;fill:#68736c}.dim{font-size:13px;fill:#496655}</style><text x="36" y="36" class="label" >MUR NORD / VUE DE DESSUS</text><text x="36" y="61" class="note" >Même échelle en largeur et en profondeur · le site reste à mesurer</text><rect x="160.0" y="130.0" width="700.0" height="20.0" fill="#d8ded4" stroke="#28332f" /><text x="410" y="114" class="label" >FAÇADE NORD</text><rect x="160.0" y="150.0" width="312.5" height="252.0" fill="#fbf3ef" stroke="#a45448" /><rect x="472.5" y="150.0" width="25.0" height="252.0" fill="#e4e6e0" stroke="#28332f" /><rect x="497.5" y="150.0" width="362.5" height="252.0" fill="#f4f6f1" stroke="#28332f" /><rect x="235.0" y="175.0" width="146.25" height="74.5" fill="#fff" stroke="#a45448" /><rect x="535.0" y="200.0" width="243.5" height="102.0" fill="#fff" stroke="#28332f" /><text x="242" y="208" class="small" >Batterie</text><text x="575" y="220" class="small" >3 groupes superposés</text><text x="575" y="245" class="small" >Profondeur maxi 408</text><rect x="160.0" y="402.0" width="700.0" height="250.0" fill="#f8f4e9" stroke="#b9a16c" stroke-dasharray="6 5"/><path d="M160 402.0h700.0" stroke="#4c705c" stroke-width="6" stroke-dasharray="15 8"/><text x="270" y="383" class="small" >Habillage ajouré démontable · hypothèse</text><text x="320" y="490" class="label" >Réserve d’accès devant : 1 000 mm</text><text x="320" y="516" class="note" >Sans bambous, stockage ni obstacle</text><path d="M572.5 310v45l-6 -8m6 8l6 -8" stroke="#4c705c" fill="none" stroke-width="2"/><path d="M710.0 310v45l-6 -8m6 8l6 -8" stroke="#4c705c" fill="none" stroke-width="2"/><text x="38" y="170" class="dim" >200 arrière*</text><text x="38" y="253" class="dim" >408 appareil</text><text x="38" y="337" class="dim" >400 devant*</text><text x="875" y="270" class="dim" >1 008 mm*</text><text x="875" y="294" class="note" >mur → écran</text><text x="875" y="490" class="dim" >1 000 mm*</text><text x="36" y="610" class="small" >* Réservations de simulation, pas des minima validés pour cette niche à trois niveaux.</text><text x="36" y="634" class="small" >Emprise étudiée : 2,80 × 1,008 m ; mur → fin de l’accès : 2,008 m. Fenêtre, robinet et regard hors emprise.</text><text x="36" y="658" class="note" >L’écran à pleine hauteur sort des cas simples de dégagement Daikin : étude aéraulique / accord fabricant requis.</text></svg>