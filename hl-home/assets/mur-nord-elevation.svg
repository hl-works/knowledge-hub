<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Mur nord — élévation des trois zones techniques</title><desc id="desc">Le rangement reste séparé des équipements électriques. Onduleur et batterie ont des réservations individuelles, leur position relative dépend du fabricant. La PAC reste à l’air libre sur une assise stable. La fenêtre et la descente d’eau restent dégagées. Schéma de principe non coté.</desc><rect width="1200" height="620" fill="#fcfcfa"/>
<g font-family="Arial,sans-serif" fill="#202522"><text x="45" y="40" font-size="13" letter-spacing="2" fill="#8a7258">02 / ÉLÉVATION SUR LA FAÇADE</text><text x="1155" y="40" text-anchor="end" font-size="12" fill="#686c68">POSITIONNEMENT À CONFIRMER PAR RELEVÉ</text>
<rect x="55" y="105" width="1090" height="375" fill="#f1f0eb"/><path d="M55 480H1145" stroke="#777c72" stroke-width="3"/>
<rect x="95" y="210" width="125" height="150" fill="#e3eeee" stroke="#8b9f9e" stroke-width="4"/><text x="157" y="189" text-anchor="middle" font-size="14">Fenêtre libre</text>
<rect x="265" y="245" width="155" height="225" rx="4" fill="#e7e1d6" stroke="#a29175"/><path d="M342 245V470M327 350v25M357 350v25" stroke="#a29175" stroke-width="2"/><text x="342" y="217" text-anchor="middle" font-size="16" font-weight="bold">Rangement</text><text x="342" y="503" text-anchor="middle" font-size="12">Armoire indépendante</text>
<rect x="455" y="168" width="195" height="303" rx="9" fill="none" stroke="#83937a" stroke-dasharray="5 5"/><rect x="488" y="195" width="128" height="90" rx="5" fill="#fff" stroke="#6d866f"/><text x="552" y="246" text-anchor="middle" font-size="16">Onduleur</text><rect x="488" y="330" width="128" height="125" rx="5" fill="#e5ebe4" stroke="#6d866f"/><text x="552" y="387" text-anchor="middle" font-size="16">Batterie</text><text x="552" y="412" text-anchor="middle" font-size="12">LFP à l’étude</text><text x="552" y="149" text-anchor="middle" font-size="14">Fixations / support à valider</text><text x="552" y="503" text-anchor="middle" font-size="12">Disposition verticale conditionnelle*</text>
<rect x="700" y="170" width="285" height="300" rx="9" fill="none" stroke="#b79a70" stroke-dasharray="5 5"/><rect x="758" y="345" width="169" height="110" rx="7" fill="#fff" stroke="#202522" stroke-width="2"/><circle cx="811" cy="400" r="35" fill="none" stroke="#84928b"/><path d="M777 400h68M811 366v68M786 375l50 50M786 425l50-50" stroke="#84928b"/><path d="M864 374h42M864 387h42M864 400h42M864 413h42" stroke="#b1b9b3" stroke-width="3"/><path d="M778 455v12M904 455v12" stroke="#202522" stroke-width="8"/><rect x="738" y="468" width="209" height="12" fill="#c2c5bd"/><text x="842" y="208" text-anchor="middle" font-size="17" font-weight="bold">PAC à l’air libre</text><text x="842" y="234" text-anchor="middle" font-size="13">Pas de coffre fermé</text><text x="842" y="260" text-anchor="middle" font-size="13">Réserve au-dessus / autour</text><text x="842" y="503" text-anchor="middle" font-size="12">Assise stable + gestion du dégivrage</text>
<path d="M1105 105V458l-20 20" fill="none" stroke="#9eafb5" stroke-width="11"/><path d="M1035 345h28v14" fill="none" stroke="#68848c" stroke-width="5"/><text x="1075" y="310" text-anchor="middle" font-size="13">Eau / EP</text><rect x="1030" y="474" width="42" height="6" fill="#89938c"/>
<text x="55" y="552" font-size="13" fill="#686c68">* Onduleur au-dessus de la batterie uniquement si les deux fabricants autorisent cette disposition et les distances.</text><text x="55" y="575" font-size="13" fill="#686c68">Sinon, les placer côte à côte en recalculant le linéaire. Panneaux solaires en toiture ; ballon thermodynamique à étudier séparément.</text><text x="55" y="598" font-size="13" fill="#686c68">Aucun raccordement électrique ou frigorifique n’est défini ici. Hauteurs, ancrages et charges restent à valider.</text></g></svg>
