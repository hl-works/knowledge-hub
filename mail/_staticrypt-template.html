        <style>
            :root {
                --paper: #FFFFFF; --ink: #0A0A0A; --plane: #F4F4F4;
                --muted: #5B5B5B; --soft: #EDEDED; --bw: 3px; --off: 6px;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --paper: #141414; --ink: #F4F4F4; --plane: #0C0C0C;
                    --muted: #9A9A9A; --soft: #1E1E1E;
                }
            }
            * { box-sizing: border-box; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; background: var(--plane); }

            .staticrypt-content {
                height: 100%; margin-bottom: 0;
                font-family: "Space Grotesk", system-ui, sans-serif;
                color: var(--ink);
                -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem;
                border: 0.25em solid var(--muted); border-right-color: transparent; border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }

            .staticrypt-page { width: 100%; max-width: 420px; padding: 12% 20px 0; margin: auto; }

            .staticrypt-form {
                position: relative; z-index: 1;
                background: var(--paper);
                margin: 0 auto 100px; padding: 36px 32px; text-align: left;
                border: var(--bw) solid var(--ink);
                box-shadow: var(--off) var(--off) 0 var(--soft);
            }

            .staticrypt-instructions { margin: 0 0 4px; }
            .staticrypt-title {
                font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px;
                text-transform: uppercase; line-height: 1.05;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                font-family: "Space Mono", ui-monospace, monospace; font-size: 12px;
                color: var(--muted); margin: 0; line-height: 1.5;
            }

            .staticrypt-hr { margin: 20px 0; border: 0; border-top: 2px solid var(--soft); }

            .staticrypt-password-container {
                position: relative; background: var(--paper);
                border: var(--bw) solid var(--ink); margin: 0 0 14px;
            }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                background: inherit; color: var(--ink); border: 0; outline: 0;
                font-family: "Space Mono", ui-monospace, monospace; font-size: 15px;
                padding: 14px 44px 14px 14px; width: 100%;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 20px; width: 20px; opacity: 0.55; padding: 13px;
                position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase; outline: 0; cursor: pointer; width: 100%;
                background: var(--ink); color: var(--paper);
                border: var(--bw) solid var(--ink);
                font-family: "Space Mono", ui-monospace, monospace; font-weight: 700; font-size: 14px;
                letter-spacing: 0.03em; padding: 15px;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus { filter: brightness(88%); }

            label.staticrypt-remember {
                display: flex; align-items: center; margin: 0 0 14px;
                font-family: "Space Mono", monospace; font-size: 12px; color: var(--muted);
            }
            .staticrypt-remember input[type="checkbox"] { transform: scale(1.4); margin-right: 12px; accent-color: var(--ink); }

            .hidden { display: none !important; }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] { font-size: 16px; }
            }
        </style>

        <script>

                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {

                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
