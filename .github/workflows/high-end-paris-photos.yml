name: Import High End Paris product photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/high-end-paris-photos.yml"
      - "scripts/import-high-end-paris-photos.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: high-end-paris-photos
  cancel-in-progress: false
jobs:
  download-and-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            high-end-paris
            scripts
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import-high-end-paris-photos.py
      - name: Commit optimized images and availability manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add high-end-paris/assets/products
          if git diff --cached --quiet; then
            echo "No product photo changes"
          else
            git commit -m "Host optimized high-end product photographs locally"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            echo "Unable to publish photos after three concurrent-update retries" >&2
            exit 1
          fi

