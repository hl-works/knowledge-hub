name: i18n — auto-translate FR → EN

# Dès qu'un contenu FR est ajouté/modifié sur main, ce workflow (re)traduit
# UNIQUEMENT sa jumelle anglaise sous /en/ et ouvre une Pull Request.
# Il ne touche jamais au site FR ni au reste du site : isolé, non bloquant.
# Prérequis : secret ANTHROPIC_API_KEY dans Settings → Secrets → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'knowledge-hub/**.html'
      - '!knowledge-hub/en/**'
      - '!landing-lab/**'
  workflow_dispatch:
    inputs:
      files:
        description: "Pages FR à traduire (séparées par des espaces). Vide = pages changées du dernier commit."
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Déterminer les pages FR à traduire
        id: pick
        env:
          REQUESTED_FILES: ${{ github.event.inputs.files || '' }}
        run: |
          set -euo pipefail
          files=()
          manual_request=false
          if [[ -n "$REQUESTED_FILES" ]]; then
            manual_request=true
            read -r -a candidates <<< "$REQUESTED_FILES"
          else
            mapfile -t candidates < <(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'knowledge-hub')
          fi
          for candidate in "${candidates[@]}"; do
            candidate="${candidate#knowledge-hub/}"
            if [[ "$manual_request" == false && "$candidate" != *.html ]]; then
              continue
            fi
            [[ "$candidate" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*\.html$ ]] || {
              echo "Chemin de page refusé: $candidate" >&2; exit 1;
            }
            [[ "$candidate" != *".."* && "$candidate" != en/* && "$candidate" != coffre/* \
              && "$candidate" != "404.html" && "$candidate" != */_template.html ]] || continue
            [[ -f "knowledge-hub/$candidate" ]] || { echo "Page absente: $candidate" >&2; exit 1; }
            files+=("$candidate")
          done
          printf 'Pages détectées :\n%s\n' "${files[*]:-aucune}"
          {
            echo 'files<<TRANSLATION_FILES'
            printf '%s\n' "${files[@]}"
            echo 'TRANSLATION_FILES'
          } >> "$GITHUB_OUTPUT"

      - name: Traduire via l'API Claude
        if: steps.pick.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FILES: ${{ steps.pick.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$FILES"
          python3 scripts/auto_translate.py "${files[@]}"

      - name: Régénérer le sitemap bilingue
        if: steps.pick.outputs.files != ''
        run: python3 scripts/build_sitemap.py

      - name: Ouvrir une Pull Request
        if: steps.pick.outputs.files != ''
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: i18n/auto-translate
          title: "i18n: traduction EN auto des pages FR modifiées"
          commit-message: "i18n: auto-translate EN counterparts of changed FR pages"
          body: |
            Traduction EN générée automatiquement pour les pages FR ajoutées/modifiées.

            ⚠️ Relire avant de merger : ton, termes métier, et que le sélecteur de
            langue / les hreflang n'ont pas bougé.
          labels: i18n, automated
          delete-branch: true
