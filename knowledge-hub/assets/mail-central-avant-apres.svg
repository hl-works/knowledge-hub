<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="mctitle mcdesc">
  <title id="mctitle">Mail Central : avant / après</title>
  <desc id="mcdesc">Avant, chaque agent (factures, tarifs, SOA, stock) lisait lui-même les boîtes mail, dédupliquait et décidait seul, si bien qu'un même message était relu plusieurs fois. Après, Mail Central lit les boîtes une seule fois, déduplique, applique les règles puis route vers trois destinations : les agents spécialisés, Hugo, ou la quarantaine.</desc>
  <defs>
    <linearGradient id="mcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#fff7f0"/>
    </linearGradient>
    <linearGradient id="mchero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#626bdc"/>
      <stop offset="1" stop-color="#d34f7d"/>
    </linearGradient>
    <filter id="mcshadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#171a3d" flood-opacity=".10"/>
    </filter>
    <marker id="mcArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9599ab"/>
    </marker>
    <marker id="mcArrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d34f7d"/>
    </marker>
  </defs>

  <rect width="1280" height="760" rx="32" fill="url(#mcbg)"/>
  <text x="64" y="62" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#171a3d">De constellations d'agents à Mail Central</text>
  <text x="64" y="98" font-family="Inter, Arial, sans-serif" font-size="18" fill="#666b82">Une seule intelligence à l'entrée, autant d'agents spécialisés en sortie.</text>

  <!-- ===================== PANNEAU AVANT ===================== -->
  <g filter="url(#mcshadow)"><rect x="48" y="150" width="576" height="556" rx="24" fill="#ffffff"/></g>
  <rect x="80" y="178" width="82" height="28" rx="6" fill="#e7e8ef"/>
  <text x="121" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#53586d">AVANT</text>
  <text x="176" y="197" font-family="Inter, Arial, sans-serif" font-size="15" fill="#666b82">des lecteurs indépendants</text>

  <!-- boîtes mail -->
  <rect x="84" y="316" width="150" height="116" rx="16" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="159" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#171a3d">Boîtes mail</text>
  <text x="159" y="393" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#53586d">5 comptes Cobra</text>

  <!-- lignes fan-out : chaque agent lit la même boîte -->
  <path d="M234 374 L404 272" stroke="#9599ab" stroke-width="2.5" fill="none" marker-end="url(#mcArrow)"/>
  <path d="M234 374 L404 342" stroke="#9599ab" stroke-width="2.5" fill="none" marker-end="url(#mcArrow)"/>
  <path d="M234 374 L404 412" stroke="#9599ab" stroke-width="2.5" fill="none" marker-end="url(#mcArrow)"/>
  <path d="M234 374 L404 482" stroke="#9599ab" stroke-width="2.5" fill="none" marker-end="url(#mcArrow)"/>

  <!-- agents -->
  <rect x="404" y="246" width="170" height="52" rx="12" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="489" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#171a3d">Factures</text>
  <rect x="404" y="316" width="170" height="52" rx="12" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="489" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#171a3d">Tarifs</text>
  <rect x="404" y="386" width="170" height="52" rx="12" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="489" y="418" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#171a3d">SOA</text>
  <rect x="404" y="456" width="170" height="52" rx="12" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="489" y="488" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#171a3d">Stock</text>

  <text x="80" y="628" font-family="Inter, Arial, sans-serif" font-size="14.5" fill="#666b82">Chaque agent lit les boîtes, déduplique et décide seul.</text>
  <text x="80" y="652" font-family="Inter, Arial, sans-serif" font-size="14.5" fill="#666b82">Un même mail relu plusieurs fois, des règles dispersées.</text>

  <!-- ===================== PANNEAU APRÈS ===================== -->
  <g filter="url(#mcshadow)"><rect x="656" y="150" width="576" height="556" rx="24" fill="#ffffff"/></g>
  <rect x="688" y="178" width="82" height="28" rx="6" fill="#fbe3ec"/>
  <text x="729" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#b23f68">APRÈS</text>
  <text x="784" y="197" font-family="Inter, Arial, sans-serif" font-size="15" fill="#666b82">un point d'entrée unique</text>

  <!-- boîtes mail -->
  <rect x="680" y="320" width="124" height="112" rx="16" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="742" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#171a3d">Boîtes mail</text>
  <text x="742" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#53586d">5 comptes</text>

  <!-- Mail Central (hero) -->
  <g filter="url(#mcshadow)"><rect x="848" y="300" width="176" height="152" rx="20" fill="url(#mchero)"/></g>
  <text x="936" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Mail Central</text>
  <text x="936" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity=".92">lire · dédupliquer · router</text>
  <text x="936" y="408" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity=".92">règles → Jev en secours</text>

  <!-- flèche boîtes -> central -->
  <path d="M804 376 L844 376" stroke="#d34f7d" stroke-width="3.5" fill="none" marker-end="url(#mcArrowAccent)"/>

  <!-- flèches central -> sorties -->
  <path d="M1024 360 L1050 306" stroke="#d34f7d" stroke-width="3" fill="none" marker-end="url(#mcArrowAccent)"/>
  <path d="M1024 384 L1050 410" stroke="#d34f7d" stroke-width="3" fill="none" marker-end="url(#mcArrowAccent)"/>
  <path d="M1024 410 L1050 484" stroke="#d34f7d" stroke-width="3" fill="none" marker-end="url(#mcArrowAccent)"/>

  <!-- sorties -->
  <rect x="1052" y="252" width="164" height="106" rx="12" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="1134" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#171a3d">Agents spécialisés</text>
  <text x="1134" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#53586d">Factures · Tarifs</text>
  <text x="1134" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#53586d">SOA · Stock</text>

  <rect x="1052" y="384" width="164" height="52" rx="12" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="1134" y="410" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#171a3d">Hugo</text>
  <text x="1134" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#53586d">cas à trancher</text>

  <rect x="1052" y="452" width="164" height="52" rx="12" fill="#eef0f5" stroke="#d9dbe6"/>
  <text x="1134" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#171a3d">Quarantaine</text>
  <text x="1134" y="496" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#53586d">messages douteux</text>

  <text x="688" y="640" font-family="Inter, Arial, sans-serif" font-size="14.5" fill="#666b82">Lire une fois · dédupliquer une fois · router une fois.</text>
  <text x="688" y="664" font-family="Inter, Arial, sans-serif" font-size="14.5" fill="#666b82">Décisions sensibles centralisées, jamais d'action auto.</text>
</svg>
