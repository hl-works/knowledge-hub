<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Contre-vérification multi-agents via OpenRouter</title>
  <desc id="desc">Claude propose un correctif, ChatGPT le relit depuis la preuve d’origine, Kimi tente de le casser, puis un contrôleur compare leurs verdicts aux scanners et à la politique de risque. Une objection renvoie le correctif en boucle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8ff"/><stop offset="1" stop-color="#fff7f1"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5965db"/><stop offset="1" stop-color="#d94d76"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="8" stdDeviation="13" flood-color="#171a3d" flood-opacity=".11"/></filter>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#6b7087"/></marker>
    <marker id="ap" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#d94d76"/></marker>
  </defs>
  <rect width="1200" height="820" rx="32" fill="url(#bg)"/>
  <text x="60" y="68" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#171a3d">Trois regards indépendants, une seule porte de sortie</text>
  <text x="60" y="104" font-family="Inter,Arial,sans-serif" font-size="19" fill="#666b82">OpenRouter distribue le même paquet de preuves. Le contrôleur rassemble les verdicts.</text>

  <path d="M421 312L318 254M779 312L882 254M421 456L318 515M779 456L882 515" stroke="#6b7087" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <g filter="url(#s)"><circle cx="600" cy="384" r="158" fill="#fff"/><circle cx="600" cy="384" r="132" fill="url(#hub)"/></g>
  <text x="600" y="328" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#fff0f5">PAQUET COMMUN</text>
  <text x="600" y="369" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">La preuve originale</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#fff"><rect x="486" y="396" width="108" height="31" rx="15" fill="#fff" fill-opacity=".16"/><text x="540" y="416" text-anchor="middle">finding + commit</text><rect x="606" y="396" width="108" height="31" rx="15" fill="#fff" fill-opacity=".16"/><text x="660" y="416" text-anchor="middle">diff proposé</text><rect x="520" y="439" width="160" height="31" rx="15" fill="#fff" fill-opacity=".16"/><text x="600" y="459" text-anchor="middle">tests attendus</text></g>

  <g filter="url(#s)" font-family="Inter,Arial,sans-serif">
    <rect x="70" y="150" width="260" height="190" rx="24" fill="#fff"/><circle cx="112" cy="194" r="23" fill="#eceeff"/><text x="112" y="201" text-anchor="middle" font-size="18" font-weight="700" fill="#5965db">C</text><text x="150" y="190" font-size="13" font-weight="700" letter-spacing="1.5" fill="#5965db">01 · PROPOSER</text><text x="150" y="217" font-size="23" font-weight="700" fill="#171a3d">Claude</text><text x="100" y="264" font-size="15" fill="#53586d">Reproduit l’erreur et prépare</text><text x="100" y="290" font-size="15" fill="#53586d">le plus petit correctif possible.</text><text x="100" y="319" font-size="12" font-weight="700" fill="#d94d76">DIFF + JUSTIFICATION</text>
    <rect x="870" y="150" width="260" height="190" rx="24" fill="#fff"/><circle cx="912" cy="194" r="23" fill="#eceeff"/><text x="912" y="201" text-anchor="middle" font-size="18" font-weight="700" fill="#5965db">G</text><text x="950" y="190" font-size="13" font-weight="700" letter-spacing="1.2" fill="#5965db">02 · CONTRE-VÉRIFIER</text><text x="950" y="217" font-size="23" font-weight="700" fill="#171a3d">ChatGPT</text><text x="900" y="264" font-size="15" fill="#53586d">Relit depuis zéro : logique,</text><text x="900" y="290" font-size="15" fill="#53586d">périmètre et tests manquants.</text><text x="900" y="319" font-size="12" font-weight="700" fill="#d94d76">ACCORD OU OBJECTION</text>
    <rect x="70" y="430" width="260" height="190" rx="24" fill="#fff"/><circle cx="112" cy="474" r="23" fill="#fff0e8"/><text x="112" y="481" text-anchor="middle" font-size="18" font-weight="700" fill="#d65b48">K</text><text x="150" y="470" font-size="13" font-weight="700" letter-spacing="1.4" fill="#d65b48">03 · ATTAQUER</text><text x="150" y="497" font-size="23" font-weight="700" fill="#171a3d">Kimi</text><text x="100" y="544" font-size="15" fill="#53586d">Cherche une régression, un</text><text x="100" y="570" font-size="15" fill="#53586d">contournement ou une faiblesse.</text><text x="100" y="599" font-size="12" font-weight="700" fill="#d94d76">ACCORD OU OBJECTION</text>
    <rect x="870" y="430" width="260" height="190" rx="24" fill="#242947"/><rect x="898" y="458" width="48" height="48" rx="13" fill="#d94d76"/><text x="922" y="489" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">HL</text><text x="966" y="470" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ef7898">04 · DÉCIDER</text><text x="966" y="497" font-size="23" font-weight="700" fill="#fff">Contrôleur</text><text x="900" y="544" font-size="15" fill="#d5d8e5">Compare les avis aux scanners,</text><text x="900" y="570" font-size="15" fill="#d5d8e5">aux tests et à la policy.</text><text x="900" y="599" font-size="12" font-weight="700" fill="#ef7898">CONTINUER OU REBOUCLER</text>
  </g>

  <path d="M600 542V660" stroke="#6b7087" stroke-width="4" marker-end="url(#a)"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="154" y="676" width="426" height="92" rx="22" fill="#fff" stroke="#e5b5c3"/><circle cx="190" cy="722" r="17" fill="#fff0f3"/><text x="190" y="729" text-anchor="middle" font-size="22" font-weight="700" fill="#d94d76">×</text><text x="220" y="713" font-size="15" font-weight="700" fill="#d94d76">UNE OBJECTION</text><text x="220" y="740" font-size="14" fill="#53586d">Retour au correcteur. Aucun merge.</text>
    <rect x="620" y="676" width="426" height="92" rx="22" fill="#fff" stroke="#a9d8bf"/><circle cx="656" cy="722" r="17" fill="#e9f8f1"/><path d="M647 722l6 6 12-15" fill="none" stroke="#278a60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="686" y="713" font-size="15" font-weight="700" fill="#278a60">AVIS CONVERGENTS</text><text x="686" y="740" font-size="14" fill="#53586d">Les tests doivent encore prouver le fix.</text>
  </g>
  <path d="M154 722H116C94 722 84 708 84 688V650C84 632 94 622 112 622" fill="none" stroke="#d94d76" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ap)"/>
</svg>
