function showVenue(browser,i){const cards=[...browser.querySelectorAll('.venue-card')];if(!cards.length)return;const ix=(i+cards.length)%cards.length;cards.forEach((e,j)=>e.style.display=j===ix?'grid':'none');browser.dataset.current=ix;browser.querySelector('.venue-count').textContent=String(ix+1).padStart(2,'0')+' / '+String(cards.length).padStart(2,'0');browser.querySelectorAll('.thumb').forEach((e,j)=>e.classList.toggle('active',j===ix));browser.querySelectorAll('.thumb')[ix]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});}
proj.addEventListener('click',e=>{const lang=e.target.closest('[data-lang]');if(lang){activateLanguage(lang.dataset.lang);return;}const step=e.target.closest('[data-venue-step]');if(step){const browser=step.closest('[data-browser]');showVenue(browser,Number(browser.dataset.current||0)+Number(step.dataset.venueStep));return;}const select=e.target.closest('[data-show-venue],[data-table-venue]');if(select){let browser=select.closest('[data-browser]');if(!browser)browser=select.closest('.venue-section').querySelector('[data-browser]');showVenue(browser,Number(select.dataset.showVenue??select.dataset.tableVenue));if(select.hasAttribute('data-table-venue'))browser.scrollIntoView({behavior:'smooth',block:'start'});}});
document.getElementById('unlock').addEventListener('submit',async e=>{
 e.preventDefault();const p=document.getElementById('password'),err=document.getElementById('error'),button=e.submitter;
 if(button)button.disabled=true;err.textContent='Ouverture du dossier…';
 try{
  const imported=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:310000,hash:'SHA-256'},imported,{name:'AES-GCM',length:256},false,['decrypt']);
  const content=await heDecryptedContent(key);let remembered=false;
  try{if(document.getElementById('remember').checked){await heStoreKey(key);remembered=true}else{await heClearKey()}}
  catch(_){err.textContent='Accès ouvert, mais la mémorisation est indisponible dans ce navigateur.'}
  heShowContent(content);if(!remembered && document.getElementById('remember').checked){
   const notice=document.createElement('p');notice.setAttribute('role','status');notice.textContent='La mémorisation est indisponible : le mot de passe sera demandé à la prochaine ouverture.';proj.prepend(notice);
  }
  p.value='';
 }catch(_){err.textContent='Mot de passe incorrect ou navigateur non compatible.';p.value=''}
 finally{if(button)button.disabled=false}
});

function activateLanguage(lang){
 const old=proj.querySelector('.lang-panel.is-current');routeTo(old?.dataset.page||'home',lang);
}
proj.addEventListener('change',e=>{
 if(e.target.matches('#languageSelect')){activateLanguage(e.target.value);return}
 if(e.target.matches('.mobile-page-select'))routeTo(e.target.value,e.target.closest('.lang-panel').dataset.language);
});
function routeTo(page,lang,replace=false){
 const legacyVenue=page==='venue';if(legacyVenue)page='places';
 const panel=[...proj.querySelectorAll('.lang-panel')].find(p=>p.dataset.language===lang);if(!panel)return;
 let route=[...panel.querySelectorAll('.route-page')].find(p=>p.dataset.page===page);
 if(!route){page='home';route=panel.querySelector('.route-page[data-page="home"]')}
 proj.querySelectorAll('.lang-panel').forEach(p=>{p.style.display=p===panel?'block':'none';p.classList.toggle('is-current',p===panel)});
 panel.querySelectorAll('.route-page').forEach(s=>s.classList.toggle('is-visible',s===route));
 panel.querySelectorAll('.page-link').forEach(b=>b.classList.toggle('is-active',b.dataset.pageLink===page));
 proj.querySelectorAll('.lang-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 panel.dataset.page=page;
 const mobile=panel.querySelector('.mobile-page-select');if(mobile)mobile.value=page;
 const language=proj.querySelector('#languageSelect');if(language)language.value=lang;
 document.documentElement.lang=lang;
 const newHash='#'+lang+'/'+page;if(location.hash!==newHash)history[replace?'replaceState':'pushState'](null,'',newHash);
 heUpdateMobileNav();heSessionLabel();window.scrollTo({top:0,behavior:'instant'});if(legacyVenue)heOpenVenueDetails(panel);
}

function heUpgradeGallery(){
 document.querySelectorAll('#project .brand-item').forEach(card=>{
  if(card.dataset.heBrandMedia)return;
   if(card.dataset.heUpgraded)return;card.dataset.heUpgraded='1';
   const title=(card.querySelector('.brand-head b')?.textContent||card.dataset.brand||'').trim();

   if(anchor){if(page==='home')anchor.before(card);else anchor.after(card)}else host.prepend(card);
  }
 }
}


/* Confidential Experience Charter: file remains in a private repository.
   Inject the link only into the decrypted project UI. */
function heAddExperienceCharter(){
 if(document.getElementById('gate').style.display!=='none')return;
 document.querySelectorAll('#project .lang-panel').forEach(panel=>{
  if(panel.querySelector('.he-charter-link'))return;
  const lang=panel.dataset.language||'fr';
  const host=panel.querySelector('.route-page[data-page="tracking"]')||panel.querySelector('.route-page[data-page="home"]');
  if(!host)return;
  const card=document.createElement('aside');card.className='he-charter-link';
  const title=document.createElement('h3');title.textContent=lang==='en'?'Experience Charter — confidential update':'Expérience & Charte — mise à jour confidentielle';
  const para=document.createElement('p');para.textContent=lang==='en'?'Exhibitor commitments, premium scenography, logistics, venues, financial framework and the March–April 2027 critical path. Internal working document; requires GitHub repository access.':'Engagements exposants, scénographie premium, contraintes logistiques, critères de lieux, budgets et rétroplanning mars–avril 2027. Document interne ; accès GitHub autorisé nécessaire.';
  const link=document.createElement('a');link.href='https://github.com/hl-works/hl-projects/blob/main/high-end-paris/experience-charter-2027.md';link.target='_blank';link.rel='noopener noreferrer';link.textContent=lang==='en'?'Open confidential document ↗':'Ouvrir le dossier confidentiel ↗';
  card.append(title,para,link);host.prepend(card);
 });
}
new MutationObserver(()=>queueMicrotask(heAddExperienceCharter)).observe(document.getElementById('project'),{childList:true,subtree:false});
</script></body></html>
