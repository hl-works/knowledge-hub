const proj=document.getElementById('project');
function showVenue(browser,i){const cards=[...browser.querySelectorAll('.venue-card')];if(!cards.length)return;const ix=(i+cards.length)%cards.length;cards.forEach((e,j)=>e.style.display=j===ix?'grid':'none');browser.dataset.current=ix;browser.querySelector('.venue-count').textContent=String(ix+1).padStart(2,'0')+' / '+String(cards.length).padStart(2,'0');browser.querySelectorAll('.thumb').forEach((e,j)=>e.classList.toggle('active',j===ix));browser.querySelectorAll('.thumb')[ix]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});}
proj.addEventListener('click',e=>{const lang=e.target.closest('[data-lang]');if(lang){const l=lang.dataset.lang;proj.querySelectorAll('.lang-panel').forEach(p=>p.style.display=p.dataset.language===l?'block':'none');proj.querySelectorAll('.lang-button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));document.documentElement.lang=l;history.replaceState(null,'',location.pathname);window.scrollTo({top:0,behavior:'smooth'});return;}const step=e.target.closest('[data-venue-step]');if(step){const browser=step.closest('[data-browser]');showVenue(browser,Number(browser.dataset.current||0)+Number(step.dataset.venueStep));return;}const select=e.target.closest('[data-show-venue],[data-table-venue]');if(select){let browser=select.closest('[data-browser]');if(!browser)browser=select.closest('.venue-section').querySelector('[data-browser]');showVenue(browser,Number(select.dataset.showVenue??select.dataset.tableVenue));if(select.hasAttribute('data-table-venue'))browser.scrollIntoView({behavior:'smooth',block:'start'});}});
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password'),err=document.getElementById('error');err.textContent='Ouverture du dossier…';try{const imported=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:310000,hash:'SHA-256'},imported,{name:'AES-GCM',length:256},false,['decrypt']);const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));const content=await new Response(new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'))).text();proj.innerHTML=content.replace(/(<button class="lang-button(?: active)?" data-lang="fr">)FR(<\/button>)/g,'$1🇫🇷 FR$2').replace(/(<button class="lang-button(?: active)?" data-lang="en">)EN(<\/button>)/g,'$1🇬🇧 EN$2').replace(/(<button class="lang-button(?: active)?" data-lang="de">)DE(<\/button>)/g,'$1🇩🇪 DE$2');document.getElementById('gate').style.display='none';proj.style.display='block';document.getElementById('lock').hidden=false;proj.querySelectorAll('[data-browser]').forEach(b=>showVenue(b,0));p.value='';window.scrollTo(0,0)}catch(x){err.textContent='Mot de passe incorrect ou navigateur non compatible.';p.value=''}});document.getElementById('lock').onclick=()=>location.reload();
function routeTo(page,lang){const panel=proj.querySelector('.lang-panel[data-language="'+lang+'"]');if(!panel)return;let route=panel.querySelector('.route-page[data-page="'+page+'"]');if(!route){page='home';route=panel.querySelector('.route-page[data-page="home"]')}panel.querySelectorAll('.route-page').forEach(s=>s.classList.toggle('is-visible',s===route));panel.querySelectorAll('.page-link').forEach(b=>b.classList.toggle('is-active',b.dataset.pageLink===page));panel.dataset.page=page;window.scrollTo({top:0,behavior:'instant'})}
proj.addEventListener('click',e=>{const link=e.target.closest('[data-page-link]');if(link){const panel=link.closest('.lang-panel');routeTo(link.dataset.pageLink,panel.dataset.language);}});
new MutationObserver(()=>{if(!proj.querySelector('.lang-panel')||proj.dataset.routesReady)return;proj.dataset.routesReady='1';proj.querySelectorAll('.lang-panel').forEach(p=>routeTo('home',p.dataset.language))}).observe(proj,{childList:true});
proj.addEventListener('click',e=>{const b=e.target.closest('.lang-button');if(b){const panel=proj.querySelector('.lang-panel[data-language="'+b.dataset.lang+'"]');if(panel){routeTo(panel.dataset.page||'home',b.dataset.lang)}}});
proj.addEventListener('input',e=>{if(!e.target.matches('.brand-search'))return;const p=e.target.closest('.lang-panel');const q=e.target.value.toLowerCase().trim();p.querySelectorAll('.brand-item').forEach(c=>c.classList.toggle('is-filtered',!c.dataset.brand.includes(q)&&!c.textContent.toLowerCase().includes(q)));p.querySelectorAll('.distributor-group').forEach(g=>g.classList.toggle('is-filtered',!g.querySelector('.brand-item:not(.is-filtered)')))});</script></body></html>
